[project]
name = "data-pipeline-agent-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.17.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.3",
    "langchain-gemini>=0.1.1",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "pandas>=3.0.6",
    "psycopg2>=2.9.13",
    "pydantic>=2.13.5",
]

[project.scripts]
data-pipeline-agent-ai = "data_pipeline_agent_ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
